<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Signed In</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url("1000.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: pink;
        }

        /* Top Navigation Bar */
        .top-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            width: 100%;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.35);
        }

        .top-nav a {
            text-decoration: none;
            color: white;
            background: rgba(0, 0, 0, 0.65);
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            transition: 0.3s;
        }

        .top-nav a:hover {
            background: #FFB6C1;
            color: black;
        }

        /* Main Content */
        .container {
            min-height: 85vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 30px 20px;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px black;
        }

        p {
            font-size: 20px;
            font-weight: bold;
            text-shadow: 1px 1px 4px black;
            line-height: 1.6;
        }

        /* Tablet Screens */
        @media (max-width: 768px) {
            .top-nav {
                gap: 8px;
                padding: 12px 10px;
            }

            .top-nav a {
                padding: 9px 12px;
                font-size: 14px;
            }

            h1 {
                font-size: 34px;
            }

            p {
                font-size: 18px;
            }

            .container {
                min-height: 85vh;
            }
        }

        /* Mobile Screens */
        @media (max-width: 480px) {
            .top-nav {
                gap: 8px;
                padding: 12px 8px;
            }

            .top-nav a {
                padding: 8px 10px;
                font-size: 12px;
            }

            h1 {
                font-size: 28px;
            }

            p {
                font-size: 16px;
            }

            .container {
                min-height: 85vh;
                padding: 20px 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="top-nav">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="product.html">Product</a>
        <a href="login.html">Login</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <h1>WELCOME! PERFUME LOVERS</h1>

        <p>
            Step into the world of SWEET SCENT,
            ELEGANCE, AND CONFIDENCE.
        </p>
    </div>

</body>
</html>
