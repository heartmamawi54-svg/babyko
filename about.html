<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfume Collection - About Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #FFB6C1;
            background-image: url("1000.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: black;
        }

        /* Header */
        header {
            background: rgba(255, 182, 193, 0.85);
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        /* Same Resized Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            width: 100%;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.35);
        }

        nav a {
            color: white;
            background: rgba(0, 0, 0, 0.65);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            transition: 0.3s;
        }

        nav a:hover {
            background: #FFB6C1;
            color: black;
            transform: translateY(-2px);
        }

        /* Main Content */
        .container {
            width: 90%;
            max-width: 850px;
            margin: 60px auto;
            padding: 40px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 15px;
            text-align: center;
        }

        .container h2 {
            color: black;
            font-size: 32px;
            margin-bottom: 20px;
        }

        .container p {
            line-height: 1.8;
            font-size: 18px;
            margin-bottom: 20px;
        }

        /* Footer */
        footer {
            background: rgba(255, 182, 193, 0.9);
            text-align: center;
            padding: 25px 20px;
            margin-top: 80px;
            font-weight: bold;
        }

        /* Tablet Screens */
        @media (max-width: 768px) {
            nav {
                gap: 8px;
                padding: 12px 10px;
            }

            nav a {
                padding: 9px 12px;
                font-size: 14px;
            }

            header h1 {
                font-size: 32px;
            }

            .container {
                margin: 35px auto;
                padding: 30px 20px;
            }

            .container h2 {
                font-size: 27px;
            }
        }

        /* Mobile Screens */
        @media (max-width: 480px) {
            nav {
                gap: 8px;
                padding: 12px 8px;
            }

            nav a {
                padding: 8px 10px;
                font-size: 12px;
            }

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 26px;
            }

            .container {
                width: 92%;
                padding: 25px 18px;
            }

            .container h2 {
                font-size: 23px;
            }

            .container p {
                font-size: 16px;
            }

            footer {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>PERFUME COLLECTION</h1>
        <p>About Us</p>
    </header>

    <!-- Navigation Bar -->
    <nav>
        <a href="login.html">login</a>
        <a href="index.html">Home</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
        <a href="product.html">Product</a>
    </nav>

    <!-- About Section -->
    <div class="container">
        <h2>About the Perfume Collection</h2>

        <p>
            Discover a fragrance that matches your personality,
            mood, and style. Every spray tells a story.
        </p>
    </div>

    <!-- Footer -->
    <footer>
        <p>Miss. HEART | PERFUME COLLECTION</p>
    </footer>

</body>
</html>
