<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #FFB6C1;
            background-image: url("1000.jpg");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            color: white;
        }

        /* Header */
        header {
            background: rgba(255, 182, 193, 0.85);
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        header p {
            font-size: 18px;
        }

        /* Same Resized Navigation Bar */
        nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 15px 20px;
            width: 100%;
            flex-wrap: wrap;
            background: rgba(0, 0, 0, 0.35);
        }

        nav a {
            color: white;
            background: rgba(0, 0, 0, 0.65);
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            white-space: nowrap;
            transition: 0.3s;
        }

        nav a:hover {
            background: #FFB6C1;
            color: black;
            transform: translateY(-2px);
        }

        /* Contact Form */
        .contact-container {
            width: 90%;
            max-width: 700px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.65);
            padding: 40px;
            border-radius: 15px;
        }

        .contact-container h2 {
            text-align: center;
            color: #FFB6C1;
            margin-bottom: 30px;
            font-size: 32px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            outline: none;
            font-size: 16px;
        }

        input:focus,
        textarea:focus {
            box-shadow: 0 0 5px #FFB6C1;
        }

        textarea {
            height: 130px;
            resize: vertical;
        }

        /* Send Message Button */
        button {
            display: block;
            margin: 25px auto 0;
            padding: 13px 35px;
            border: none;
            border-radius: 8px;
            background: #FF69B4;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #FFB6C1;
            color: black;
            transform: scale(1.05);
        }

        /* Log Out Button */
        .logout {
            display: block;
            width: fit-content;
            margin: 20px auto 0;
            padding: 12px 30px;
            border-radius: 8px;
            background: rgba(255, 182, 193, 0.9);
            color: black;
            text-decoration: none;
            font-weight: bold;
            transition: 0.3s;
        }

        .logout:hover {
            background: white;
            transform: scale(1.05);
        }

        /* Footer */
        footer {
            background: rgba(255, 182, 193, 0.9);
            color: black;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }

        /* Tablet */
        @media (max-width: 768px) {
            nav {
                gap: 8px;
                padding: 12px 10px;
            }

            nav a {
                padding: 9px 12px;
                font-size: 14px;
            }

            header h1 {
                font-size: 32px;
            }

            .contact-container {
                padding: 30px;
            }
        }

        /* Mobile */
        @media (max-width: 480px) {
            nav {
                gap: 8px;
                padding: 12px 8px;
            }

            nav a {
                padding: 8px 10px;
                font-size: 12px;
            }

            header {
                padding: 30px 15px;
            }

            header h1 {
                font-size: 26px;
            }

            .contact-container {
                width: 92%;
                padding: 22px;
                margin: 30px auto;
            }

            .contact-container h2 {
                font-size: 26px;
            }

            input,
            textarea {
                font-size: 14px;
            }

            footer {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>For More Information</h1>
        <p>Contact Us</p>
    </header>

    <!-- Same Navigation Bar -->
    <nav>
        <a href="index.html">Index</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
        <a href="product.html">Product</a>
        <a href="login.html">Logout</a>
    </nav>

    <!-- Contact Form -->
    <div class="contact-container">

        <h2>Contact Us</h2>

        <form onsubmit="sendMessage(event)">

            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your name"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="message">Message</label>
            <textarea
                id="message"
                placeholder="Write your message..."
                required
            ></textarea>

            <button type="submit">Send Message</button>

        </form>

        <!-- Log Out Button -->
        <a class="logout" href="login.html">Log Out</a>

    </div>

    <!-- Footer -->
    <footer>
        <p>Miss. HEART | BARBIR COLLECTION</p>
    </footer>

    <!-- JavaScript -->
    <script>
        function sendMessage(event) {
            event.preventDefault();

            alert("Thank you! Your message has been submitted.");

            document.getElementById("name").value = "";
            document.getElementById("email").value = "";
            document.getElementById("message").value = "";
        }
    </script>

</body>
</html>
