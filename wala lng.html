<!DOCTYPE html>
<html>
<head>
    <title>Video Wallpaper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
        }
        /* Video Background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        /* Content */
        .content {
            position: relative;
            z-index: 1;
            color: white;
            text-align: center;
            padding-top: 250px;
            font-family: Arial, sans-serif;
        }
        h1 {
            font-size: 50px;
        }
        p {
            font-size: 20px;
        }
    </style>
</head>
<body>
    <video class="video-bg" autoplay muted loop>
        <source src="hello.mp4" type="video/mp4">
    </video>
    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>Enjoy the video background!</p>
    </div>

                <input type="username" id="heart" required placeholder="Enter Username">
           
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="1111" required placeholder="Enter Password">
            </div>

            <button type="submit" class="submit-btn">Log in </button>

            <p id="error-message" class="error-message"></p>
        </form>
    </div>
	
</body>
</html>
